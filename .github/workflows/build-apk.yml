name: Build Android APK (Cordova)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Java JDK 17
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install Cordova CLI
      - name: Install Cordova CLI
        run: npm install -g cordova

      # 6. Initialize Cordova & Inject Native Fullscreen Settings
      - name: Build Cordova Android Project
        run: |
          # Create Cordova project structure
          cordova create cordovaApp com.aerus.game "Aerus Realm of Champions"
          
          # Clean default www folder
          rm -rf cordovaApp/www/*
          
          # Copy your game assets into www/
          cp -r index.html style.css game3d.js script.js image cordovaApp/www/
          
          # Replace default Cordova config.xml with your custom config.xml
          cp config.xml cordovaApp/config.xml
          
          cd cordovaApp
          
          # Add Android platform
          cordova platform add android
          
          # Install plugins for Fullscreen and Orientation control
          cordova plugin add cordova-plugin-fullscreen
          cordova plugin add cordova-plugin-screen-orientation
          cordova plugin add cordova-plugin-statusbar

      # 7. Compile Debug APK
      - name: Compile APK with Cordova
        run: |
          cd cordovaApp
          cordova build android --debug

      # 8. Upload Artifact
      - name: Upload Cordova APK
        uses: actions/upload-artifact@v4
        with:
          name: Aerus-RealmOfChampions-Cordova-APK
          path: cordovaApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
