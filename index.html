<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aerus: Realm of Champions</title>
  
  <!-- Favicon / Tab Icon -->
  <link rel="icon" type="image/png" href="image/mainlogo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0e14;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    #game-container {
      position: relative;
      border: 3px solid #1e293b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      overflow: hidden;
      max-width: 100vw;
    }
    
    /* UI Layer & Logo Header */
    .ui-layer {
      position: absolute;
      top: 10px;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      pointer-events: none;
      z-index: 10;
    }
    .center-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: auto;
    }
    .game-logo {
      height: 40px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0px 2px 8px rgba(0, 0, 0, 0.8));
    }
    .header-btns {
      display: flex;
      gap: 6px;
    }
    .ui-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-size: 10px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .health-box {
      width: 32%;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #334155;
      padding: 5px;
      border-radius: 6px;
    }
    .player-name {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .p1-name { color: #38bdf8; }
    .p2-name { color: #f43f5e; text-align: right; }
    .bar-bg {
      background-color: #0f172a;
      height: 16px;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.1s linear;
    }
    #p1-health { background-color: #38bdf8; }
    #p2-health { background-color: #f43f5e; float: right; }

    canvas {
      display: block;
      background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%);
      width: 100%;
      height: auto;
    }

    /* On-Screen Mobile Controls */
    #mobile-controls {
      position: absolute;
      bottom: 15px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 20;
    }
    .control-group {
      display: flex;
      gap: 12px;
    }
    .touch-btn {
      width: 55px;
      height: 55px;
      background: rgba(30, 41, 59, 0.75);
      border: 2px solid rgba(148, 163, 184, 0.5);
      border-radius: 50%;
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      touch-action: none;
    }
    .touch-btn:active {
      background: rgba(56, 189, 248, 0.6);
      border-color: #38bdf8;
      transform: scale(0.95);
    }
    .btn-attack {
      background: rgba(244, 63, 94, 0.35);
      border-color: rgba(244, 63, 94, 0.7);
    }
    .btn-attack:active {
      background: rgba(244, 63, 94, 0.8);
      border-color: #f43f5e;
    }

    /* Victory/Defeat Game Over Overlay */
    #game-over-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 14, 20, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      backdrop-filter: blur(6px);
    }
    #result-banner {
      max-width: 80%;
      max-height: 50%;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(0,0,0,0.9));
      margin-bottom: 20px;
    }
    .restart-btn {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      padding: 12px 30px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.1s ease;
    }
    .restart-btn:active {
      transform: scale(0.95);
    }

    .controls-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }

    /* MANDATORY LANDSCAPE OVERLAY FOR MOBILE */
    #rotate-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0b0e14;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    #rotate-warning p {
      font-size: 18px;
      color: #38bdf8;
      font-weight: bold;
      margin-top: 10px;
    }

    /* Force landscape view on mobile screens */
    @media screen and (max-width: 900px) and (orientation: portrait) {
      #rotate-warning {
        display: flex;
      }
      #game-container, .controls-hint {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Screen Orientation Warning -->
  <div id="rotate-warning">
    <div style="font-size: 40px;">🔄</div>
    <p>Please rotate your phone to Landscape mode to play!</p>
  </div>

  <div id="game-container">
    <div class="ui-layer">
      <!-- Player 1 Health -->
      <div class="health-box">
        <div class="player-name p1-name">Champion 1 (Aerus)</div>
        <div class="bar-bg">
          <div id="p1-health" class="bar-fill"></div>
        </div>
      </div>

      <!-- Game Logo & Mode Toggle Header -->
      <div class="center-header">
        <img src="image/mainlogo.png" alt="Aerus Logo" class="game-logo">
        <div class="header-btns">
          <button id="mode-toggle" class="ui-btn">VS Computer</button>
          <button id="sound-toggle" class="ui-btn">🔊 Audio: ON</button>
        </div>
      </div>

      <!-- Player 2 / Bot Health -->
      <div class="health-box">
        <div class="player-name p2-name" id="p2-label">CPU (Rival AI)</div>
        <div class="bar-bg">
          <div id="p2-health" class="bar-fill"></div>
        </div>
      </div>
    </div>

    <!-- Victory / Defeat Overlay Popup -->
    <div id="game-over-overlay">
      <img id="result-banner" src="" alt="Game Result">
      <button class="restart-btn" id="restart-btn">Play Again</button>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <!-- On-Screen Touch Buttons for Mobile -->
    <div id="mobile-controls">
      <div class="control-group">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
      </div>
      <div class="control-group">
        <div class="touch-btn" id="btn-jump">▲</div>
        <div class="touch-btn btn-attack" id="btn-attack">⚔</div>
      </div>
    </div>
  </div>

  <div class="controls-hint">
    <strong>P1 Controls:</strong> A/D or Touch ◀/▶ (Move) | W or ▲ (Jump) | SPACE or ⚔ (Attack)
  </div>

  <!-- External Script Reference -->
  <script src="script.js"></script>
</body>
</html>
