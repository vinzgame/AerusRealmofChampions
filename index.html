<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aerus: Realm of Champions</title>
  
  <!-- Favicon / Tab Icon -->
  <link rel="icon" type="image/png" href="image/mainlogo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0e14;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    #game-container {
      position: relative;
      border: 3px solid #1e293b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      overflow: hidden;
      max-width: 100vw;
    }
    
    /* UI Layer & Logo Header */
    .ui-layer {
      position: absolute;
      top: 10px;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      pointer-events: none;
      z-index: 10;
    }
    .center-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: auto;
    }
    .game-logo {
      height: 40px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0px 2px 8px rgba(0, 0, 0, 0.8));
    }
    .mode-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-size: 10px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .health-box {
      width: 32%;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #334155;
      padding: 5px;
      border-radius: 6px;
    }
    .player-name {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .p1-name { color: #38bdf8; }
    .p2-name { color: #f43f5e; text-align: right; }
    .bar-bg {
      background-color: #0f172a;
      height: 16px;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.1s linear;
    }
    #p1-health { background-color: #38bdf8; }
    #p2-health { background-color: #f43f5e; float: right; }

    canvas {
      display: block;
      background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%);
      width: 100%;
      height: auto;
    }

    /* On-Screen Mobile Controls */
    #mobile-controls {
      position: absolute;
      bottom: 15px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 20;
    }
    .control-group {
      display: flex;
      gap: 12px;
    }
    .touch-btn {
      width: 55px;
      height: 55px;
      background: rgba(30, 41, 59, 0.75);
      border: 2px solid rgba(148, 163, 184, 0.5);
      border-radius: 50%;
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      touch-action: none;
    }
    .touch-btn:active {
      background: rgba(56, 189, 248, 0.6);
      border-color: #38bdf8;
      transform: scale(0.95);
    }
    .btn-attack {
      background: rgba(244, 63, 94, 0.35);
      border-color: rgba(244, 63, 94, 0.7);
    }
    .btn-attack:active {
      background: rgba(244, 63, 94, 0.8);
      border-color: #f43f5e;
    }

    /* Victory/Defeat Game Over Overlay */
    #game-over-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 14, 20, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      backdrop-filter: blur(6px);
    }
    #result-banner {
      max-width: 80%;
      max-height: 50%;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(0,0,0,0.9));
      margin-bottom: 20px;
    }
    .restart-btn {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      padding: 12px 30px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.1s ease;
    }
    .restart-btn:active {
      transform: scale(0.95);
    }

    .controls-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui-layer">
      <!-- Player 1 Health -->
      <div class="health-box">
        <div class="player-name p1-name">Champion 1 (Aerus)</div>
        <div class="bar-bg">
          <div id="p1-health" class="bar-fill"></div>
        </div>
      </div>

      <!-- Game Logo & Mode Toggle Header -->
      <div class="center-header">
        <img src="image/mainlogo.png" alt="Aerus Logo" class="game-logo">
        <button id="mode-toggle" class="mode-btn">Mode: VS Computer</button>
      </div>

      <!-- Player 2 / Bot Health -->
      <div class="health-box">
        <div class="player-name p2-name" id="p2-label">CPU (Rival AI)</div>
        <div class="bar-bg">
          <div id="p2-health" class="bar-fill"></div>
        </div>
      </div>
    </div>

    <!-- Victory / Defeat Overlay Popup -->
    <div id="game-over-overlay">
      <img id="result-banner" src="" alt="Game Result">
      <button class="restart-btn" id="restart-btn">Play Again</button>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <!-- On-Screen Touch Buttons for Mobile -->
    <div id="mobile-controls">
      <div class="control-group">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
      </div>
      <div class="control-group">
        <div class="touch-btn" id="btn-jump">▲</div>
        <div class="touch-btn btn-attack" id="btn-attack">⚔</div>
      </div>
    </div>
  </div>

  <div class="controls-hint">
    <strong>P1 Controls:</strong> A/D or Touch ◀/▶ (Move) | W or ▲ (Jump) | SPACE or ⚔ (Attack)
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GRAVITY = 0.6;
    const GROUND_Y = 320;
    let isAiMode = true;
    let gameOver = false;

    // Load Animated Sprite Sheets using embedded Data URIs for instant cross-origin loading
    function createWarriorSprite(colorHex, glowHex) {
      const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
        <defs>
          <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <!-- Body Base -->
        <rect x="75" y="60" width="50" height="70" rx="8" fill="${colorHex}" stroke="#0f172a" stroke-width="4"/>
        <!-- Head / Helmet -->
        <circle cx="100" cy="40" r="24" fill="${colorHex}" stroke="#0f172a" stroke-width="4"/>
        <rect x="85" y="32" width="30" height="8" rx="3" fill="#0f172a"/>
        <!-- Eyes / Visor -->
        <rect x="90" y="34" width="20" height="4" rx="2" fill="${glowHex}" filter="url(#glow)"/>
        <!-- Sword -->
        <path d="M130 50 L180 20 L170 10 L120 40 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
        <rect x="118" y="38" width="12" height="6" fill="#f59e0b"/>
      </svg>`;
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
      return img;
    }

    const p1Sprite = createWarriorSprite('#38bdf8', '#7dd3fc');
    const p2Sprite = createWarriorSprite('#f43f5e', '#fda4af');

    // Fighter Class
    class Fighter {
      constructor({ position, velocity, sprite, attackBoxOffset, name, healthBarId }) {
        this.position = position;
        this.velocity = velocity;
        this.width = 60;
        this.height = 100;
        this.sprite = sprite;
        this.name = name;
        this.health = 100;
        this.healthBar = document.getElementById(healthBarId);
        
        this.isAttacking = false;
        this.attackBox = {
          position: { x: this.position.x, y: this.position.y },
          offset: attackBoxOffset,
          width: 90,
          height: 50
        };
        this.facing = 'right';
        this.animFrame = 0;
        this.animTimer = 0;
      }

      draw() {
        ctx.save();

        // Handle Horizontal Flipping depending on Direction
        if (this.facing === 'left') {
          ctx.translate(this.position.x + this.width, this.position.y);
          ctx.scale(-1, 1);
        } else {
          ctx.translate(this.position.x, this.position.y);
        }

        // Bobbing & Swings based on state
        let yOffset = 0;
        let rotation = 0;

        if (Math.abs(this.velocity.x) > 0) {
          // Running Animation Bounce
          this.animTimer += 0.2;
          yOffset = Math.sin(this.animTimer) * 4;
        }

        if (this.velocity.y !== 0) {
          // Jump Tilt
          rotation = 0.08;
        }

        if (this.isAttacking) {
          // Slash Forward Motion
          ctx.translate(10, 0);
          rotation = -0.15;
        }

        ctx.rotate(rotation);
        ctx.drawImage(this.sprite, 0, yOffset, this.width, this.height);

        // Render Sword Swing Effect during Attack
        if (this.isAttacking) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.beginPath();
          ctx.arc(this.width / 2 + 30, this.height / 2, 45, -Math.PI / 4, Math.PI / 4);
          ctx.fill();
        }

        ctx.restore();
      }

      update() {
        this.draw();

        if (this.facing === 'right') {
          this.attackBox.position.x = this.position.x + this.attackBox.offset.x;
        } else {
          this.attackBox.position.x = this.position.x - this.attackBox.width + 20;
        }
        this.attackBox.position.y = this.position.y + this.attackBox.offset.y;

        this.position.x += this.velocity.x;
        this.position.y += this.velocity.y;

        if (this.position.y + this.height + this.velocity.y >= GROUND_Y) {
          this.velocity.y = 0;
          this.position.y = GROUND_Y - this.height;
        } else {
          this.velocity.y += GRAVITY;
        }

        if (this.position.x < 0) this.position.x = 0;
        if (this.position.x + this.width > canvas.width) this.position.x = canvas.width - this.width;
      }

      attack() {
        if (this.isAttacking || gameOver) return;
        this.isAttacking = true;
        setTimeout(() => {
          this.isAttacking = false;
        }, 150);
      }

      takeDamage(amount) {
        this.health -= amount;
        if (this.health < 0) this.health = 0;
        this.healthBar.style.width = this.health + '%';
      }

      reset(xPos) {
        this.health = 100;
        this.healthBar.style.width = '100%';
        this.position.x = xPos;
        this.position.y = 100;
        this.velocity = { x: 0, y: 0 };
        this.isAttacking = false;
      }
    }

    // Instantiate Champions
    const player1 = new Fighter({
      position: { x: 100, y: 100 },
      velocity: { x: 0, y: 0 },
      sprite: p1Sprite,
      attackBoxOffset: { x: 40, y: 20 },
      name: 'Aerus',
      healthBarId: 'p1-health'
    });

    const player2 = new Fighter({
      position: { x: 640, y: 100 },
      velocity: { x: 0, y: 0 },
      sprite: p2Sprite,
      attackBoxOffset: { x: 0, y: 20 },
      name: 'Rival',
      healthBarId: 'p2-health'
    });
    player2.facing = 'left';

    // Inputs
    const keys = {
      a: { pressed: false },
      d: { pressed: false },
      ArrowLeft: { pressed: false },
      ArrowRight: { pressed: false }
    };

    // UI & Mode Control Elements
    const modeBtn = document.getElementById('mode-toggle');
    const p2Label = document.getElementById('p2-label');
    const gameOverOverlay = document.getElementById('game-over-overlay');
    const resultBanner = document.getElementById('result-banner');
    const restartBtn = document.getElementById('restart-btn');

    modeBtn.addEventListener('click', () => {
      isAiMode = !isAiMode;
      if (isAiMode) {
        modeBtn.innerText = 'Mode: VS Computer';
        p2Label.innerText = 'CPU (Rival AI)';
      } else {
        modeBtn.innerText = 'Mode: 2 Player Local';
        p2Label.innerText = 'Champion 2 (P2)';
      }
    });

    // Keyboard Listeners
    window.addEventListener('keydown', (event) => {
      if (gameOver) return;
      switch (event.key) {
        case 'a': case 'A': keys.a.pressed = true; player1.facing = 'left'; break;
        case 'd': case 'D': keys.d.pressed = true; player1.facing = 'right'; break;
        case 'w': case 'W': if (player1.velocity.y === 0) player1.velocity.y = -14; break;
        case ' ': player1.attack(); break;

        // Player 2 Manual Keys
        case 'ArrowLeft': if (!isAiMode) { keys.ArrowLeft.pressed = true; player2.facing = 'left'; } break;
        case 'ArrowRight': if (!isAiMode) { keys.ArrowRight.pressed = true; player2.facing = 'right'; } break;
        case 'ArrowUp': if (!isAiMode && player2.velocity.y === 0) player2.velocity.y = -14; break;
        case 'Enter': if (!isAiMode) player2.attack(); break;
      }
    });

    window.addEventListener('keyup', (event) => {
      switch (event.key) {
        case 'a': case 'A': keys.a.pressed = false; break;
        case 'd': case 'D': keys.d.pressed = false; break;
        case 'ArrowLeft': keys.ArrowLeft.pressed = false; break;
        case 'ArrowRight': keys.ArrowRight.pressed = false; break;
      }
    });

    // Touch Event Listeners
    function bindTouchButton(btnId, onPress, onRelease) {
      const btn = document.getElementById(btnId);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); if (!gameOver) onPress(); });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); if (onRelease) onRelease(); });
    }

    bindTouchButton('btn-left', () => { keys.a.pressed = true; player1.facing = 'left'; }, () => { keys.a.pressed = false; });
    bindTouchButton('btn-right', () => { keys.d.pressed = true; player1.facing = 'right'; }, () => { keys.d.pressed = false; });
    bindTouchButton('btn-jump', () => { if (player1.velocity.y === 0) player1.velocity.y = -14; });
    bindTouchButton('btn-attack', () => { player1.attack(); });

    // Computer Bot / AI Logic
    function updateComputerAI() {
      if (!isAiMode || player2.health <= 0 || gameOver) return;

      const distanceToPlayer = player1.position.x - player2.position.x;

      if (distanceToPlayer > 0) {
        player2.facing = 'right';
      } else {
        player2.facing = 'left';
      }

      if (Math.abs(distanceToPlayer) > 60) {
        player2.velocity.x = distanceToPlayer > 0 ? 3.5 : -3.5;
      } else {
        player2.velocity.x = 0;
        if (Math.random() < 0.05) {
          player2.attack();
        }
      }

      if (player1.position.y < GROUND_Y - 120 && player2.velocity.y === 0 && Math.random() < 0.08) {
        player2.velocity.y = -14;
      }
    }

    // Collision Helper
    function rectangularCollision({ rectangle1, rectangle2 }) {
      return (
        rectangle1.attackBox.position.x + rectangle1.attackBox.width >= rectangle2.position.x &&
        rectangle1.attackBox.position.x <= rectangle2.position.x + rectangle2.width &&
        rectangle1.attackBox.position.y + rectangle1.attackBox.height >= rectangle2.position.y &&
        rectangle1.attackBox.position.y <= rectangle2.position.y + rectangle2.height
      );
    }

    // End Game Handler (Triggers victory.png or defeat.png)
    function checkGameOver() {
      if (gameOver) return;

      if (player2.health <= 0) {
        gameOver = true;
        resultBanner.src = 'image/victory.png';
        gameOverOverlay.style.display = 'flex';
      } else if (player1.health <= 0) {
        gameOver = true;
        resultBanner.src = 'image/defeat.png';
        gameOverOverlay.style.display = 'flex';
      }
    }

    // Restart System
    restartBtn.addEventListener('click', () => {
      gameOver = false;
      gameOverOverlay.style.display = 'none';
      player1.reset(100);
      player2.reset(640);
      player2.facing = 'left';
    });

    // Main Game Loop
    function animate() {
      window.requestAnimationFrame(animate);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Arena Stage Ground
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

      player1.velocity.x = 0;
      if (!isAiMode) player2.velocity.x = 0;

      if (!gameOver) {
        // Player 1 Movement
        if (keys.a.pressed) player1.velocity.x = -5;
        else if (keys.d.pressed) player1.velocity.x = 5;

        // Player 2 Manual Movement / AI
        if (!isAiMode) {
          if (keys.ArrowLeft.pressed) player2.velocity.x = -5;
          else if (keys.ArrowRight.pressed) player2.velocity.x = 5;
        } else {
          updateComputerAI();
        }
      }

      player1.update();
      player2.update();

      if (!gameOver) {
        // Check Hits (P1 -> P2)
        if (rectangularCollision({ rectangle1: player1, rectangle2: player2 }) && player1.isAttacking) {
          player1.isAttacking = false;
          player2.takeDamage(10);
        }

        // Check Hits (P2 -> P1)
        if (rectangularCollision({ rectangle1: player2, rectangle2: player1 }) && player2.isAttacking) {
          player2.isAttacking = false;
          player1.takeDamage(10);
        }

        checkGameOver();
      }
    }

    animate();
  </script>
</body>
</html>
