<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aerus: Realm of Champions</title>
    <link rel="stylesheet" href="style.css">

    <!-- 3D Engine Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <!-- 1. LOADING SCREEN -->
    <div id="loading-screen" class="screen active">
        <div class="loading-container">
            <h1 class="game-title">AERUS</h1>
            <p class="game-subtitle">REALM OF CHAMPIONS</p>
            <div class="progress-bar-container">
                <div id="loading-bar"></div>
            </div>
            <p id="loading-text">Initializing Sound & Realm Engine...</p>
        </div>
    </div>

    <!-- 2. HOME SCREEN / CHARACTER SELECT -->
    <div id="home-screen" class="screen hidden">
        <header class="top-bar">
            <div class="user-info">
                <span id="p1-display-name">CHAMPION</span>
            </div>
            <div class="currency-display">
                🪙 <span id="coin-count">1,250</span>
            </div>
        </header>

        <main class="home-content">
            <div class="character-preview">
                <button id="char-prev" class="nav-arrow">❮</button>
                <div class="char-details">
                    <h2 id="char-name">UNIT-01 ROBOT</h2>
                    <p id="char-desc">Fast cybernetic hero with high agility and rapid energy strikes.</p>
                </div>
                <button id="char-next" class="nav-arrow">❯</button>
            </div>
            <button id="play-btn" class="btn play-btn">ENTER BATTLE</button>
        </main>
    </div>

    <!-- 3. GAME SCREEN -->
    <div id="game-screen" class="screen hidden">
        <div id="game-hud">
            <div class="hud-player p1">
                <span class="player-label" id="p1-name-hud">PLAYER 1</span>
                <div class="hp-bar-bg"><div id="p1-hp-bar" class="hp-bar"></div></div>
                <span id="p1-hp-text">100%</span>
            </div>

            <div id="round-indicator">ROUND 1</div>

            <div class="hud-player p2">
                <span class="player-label" id="p2-name-hud">CYBER SOLDIER</span>
                <div class="hp-bar-bg"><div id="p2-hp-bar" class="hp-bar"></div></div>
                <span id="p2-hp-text">100%</span>
            </div>
        </div>

        <!-- Floating Damage Overlay -->
        <div id="damage-overlay"></div>

        <!-- 3D Canvas Target -->
        <div id="game-canvas-container"></div>

        <!-- Touch Controls -->
        <div id="touch-controls">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
            <div class="action-buttons">
                <button id="btn-jump" class="control-btn">JUMP</button>
                <button id="btn-attack" class="control-btn attack">ATTACK</button>
            </div>
        </div>
    </div>

    <!-- 4. MATCH OVER MODAL -->
    <div id="match-over-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 id="match-result-title">VICTORY!</h2>
            <div class="modal-actions">
                <button id="rematch-btn" class="btn primary-btn">REMATCH</button>
                <button id="home-return-btn" class="btn secondary">MAIN MENU</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="game3d.js"></script>
    <script src="script.js"></script>
</body>
</html>
